<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | ReturnPulse AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            position: relative;
        }
        .glow {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, transparent 70%);
            filter: blur(80px);
            z-index: 0;
        }
        .content {
            position: relative;
            z-index: 1;
            max-width: 550px;
            padding: 30px;
        }
        .error-code {
            font-size: 7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="content">
        <div class="error-code">404</div>
        <h2 class="fw-bold text-light mb-3">Order Not Located</h2>
        <p class="text-secondary mb-4">
            The destination URL or operational route you are requesting does not exist on this server.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="/" class="btn btn-primary px-4 fw-bold" style="background: #6366f1; border: none; border-radius: 10px;">
                <i class="fa-solid fa-house me-1"></i> Return Home
            </a>
            <a href="/dashboard/" class="btn btn-outline-light px-4 fw-bold" style="border-radius: 10px;">
                <i class="fa-solid fa-chart-line me-1"></i> View Dashboard
            </a>
        </div>
    </div>
</body>
</html>
